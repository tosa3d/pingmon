# ============================================================================
# pingmon config
#
# Two things go in here:
#   1) services - the ping-reduction services you want to compare
#   2) games    - the games and regions you actually play on
#
# The endpoints below were tested and verified 2026-09. Run
# `pingmon validate` once before a long run to confirm they answer from
# your own line too.
# ============================================================================

run:
  block_seconds: 60        # length of each measurement block
  settle_seconds: 8        # pause after switching service (data discarded)
  rounds: 6                # repeats per service - do not go below 4
  rate_hz: 5               # probes per second, per target
  timeout: 2.0
  randomize_order: true    # shuffle service order within each round
  outdir: ./pingmon-runs

# ---------------------------------------------------------------------------
# Services
#
# mode: manual   -> the tool pauses and tells you to switch, you press Enter
# mode: command  -> the tool runs the command itself (WireGuard/OpenVPN etc.)
#
# Exactly one entry must have baseline: true.
# ---------------------------------------------------------------------------
services:
  - name: baseline
    mode: manual
    baseline: true
    instruction: "Turn OFF every ping-reduction service (direct connection)"

  - name: ExitLag
    mode: manual
    instruction: "Turn ExitLag on and apply it to the game"

  - name: NoPing
    mode: manual
    instruction: "Close ExitLag, turn NoPing on"

  # Automatic mode example, if your tunnel has a CLI:
  # - name: wg-frankfurt
  #   mode: command
  #   up:   "wg-quick up frankfurt"
  #   down: "wg-quick down frankfurt"

# ---------------------------------------------------------------------------
# Games
#
# genre changes the score weighting:
#   fps  -> jitter and burst loss weigh more
#   moba -> average ping weighs more
#
# Start with only the region you actually play on. Fewer targets means a
# higher probe rate each and cleaner data.
# ---------------------------------------------------------------------------
games:

  # ---- Rainbow Six Siege - on Microsoft Azure ---------------------------
  # R6's in-game region names ARE Azure region names. Check which region
  # you are on in game and enable that one (plus a couple of options).
  - name: r6
    enabled: true
    genre: fps
    method: tcp
    targets:
      - { region: "UAE North",      host: "uaenorth.monitoring.azure.com" }
      - { region: "West Europe",    host: "westeurope.monitoring.azure.com" }
      - { region: "France Central", host: "francecentral.monitoring.azure.com" }
      # - { region: "Poland Central", host: "polandcentral.monitoring.azure.com" }
      # - { region: "Qatar Central",  host: "qatarcentral.monitoring.azure.com" }
      # - { region: "UK South",       host: "uksouth.monitoring.azure.com" }

  # ---- CS2 - Steam Datagram Relay ----------------------------------------
  # Get the Valve relay IPs with `pingmon sdr-refresh` and paste them here.
  # Leave this game disabled until you have.
  - name: cs2
    enabled: false
    genre: fps
    method: tcp
    targets:
      - { region: "fra", ip: "0.0.0.0", port: 27015, note: "fill via sdr-refresh" }

  # ---- Apex Legends - Multiplay/i3D on AWS -------------------------------
  - name: apex
    enabled: true
    genre: fps
    method: tcp
    targets:
      - { region: "Bahrain",   host: "dynamodb.me-south-1.amazonaws.com" }
      - { region: "Frankfurt", host: "dynamodb.eu-central-1.amazonaws.com" }
      # - { region: "London",    host: "dynamodb.eu-west-2.amazonaws.com" }
      # - { region: "Milan",     host: "dynamodb.eu-south-1.amazonaws.com" }

  # ---- CoD Warzone - undocumented hosting --------------------------------
  # These are rough stand-ins. For a result you can rely on, run
  # `pingmon discover --game warzone` mid-match and paste the real IP here.
  - name: warzone
    enabled: true
    genre: fps
    method: tcp
    targets:
      - { region: "EU Frankfurt (approx)", host: "dynamodb.eu-central-1.amazonaws.com" }
      - { region: "EU Amsterdam (approx)", host: "europe-west4-run.googleapis.com" }

  # ---- EA FC 26 -----------------------------------------------------------
  # Important: only the dedicated-server modes (Ultimate Team, Clubs, Rush,
  # VOLTA) are meaningful. Online Seasons and Friendlies are peer-to-peer -
  # there is no server in the middle whose route could be optimised, so
  # testing them is pointless.
  - name: fc26
    enabled: true
    genre: moba          # stronger lag compensation -> average ping matters more
    method: tcp
    targets:
      - { region: "EU West (approx)",    host: "dynamodb.eu-west-1.amazonaws.com" }
      - { region: "EU Central (approx)", host: "dynamodb.eu-central-1.amazonaws.com" }
